[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colorcalib"
version = "0.1.0"
description = "Interpretable cross-camera color calibration from reference color charts"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.7",
    "pillow>=9.5",
    "flask>=2.3",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
colorcalib = "colorcalib.cli:main"

[tool.setuptools]
packages = ["colorcalib"]
